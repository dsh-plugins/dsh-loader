# 自动发布到 npm：参考 dsh-auxiliary 与 dsh-thought-buddy 的 npm-publish.yml。
#
# 与参考仓库的差异：
#   - 本仓库不提交锁文件，因此用 `npm install` 代替 `npm ci`，也不使用
#     setup-node 的 npm 缓存（缓存依赖锁文件）。
#   - 质量检查运行 typecheck、完整构建和 npm test。
#     测试用例从 ../dist/*.js 导入编译产物，而 dist/ 是 gitignored 的，
#     因此 package.json 里的 `pretest` 会先执行 `build:host`（tsc）生成 dist。
#   - 客户端 bundle 由 tsdown 构建（`npm run build:client`），tsdown 已加入
#     devDependencies，干净环境安装后即可构建 lib/client.js。
#   - 发布时需先执行完整 `npm run build`（tsc 生成 dist + tsdown 生成 lib），
#     否则发布的 tarball 会缺少 package.json main 指向的 dist/index.js。
#   - 发布规则与参考一致：推送 main 发布 -dev.<run-id>（dist-tag=next），
#     打 vX.Y.Z 标签发布正式版（dist-tag=latest，要求标签名与版本号完全一致）。
name: CI and npm Publish

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  NPM_REGISTRY: 'https://registry.npmjs.org'

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ env.NPM_REGISTRY }}
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npm run typecheck
      - name: Build host and client
        run: npm run build
      - name: Run tests
        run: npm test
      - name: Inspect npm package contents
        run: npm pack --dry-run

  publish:
    name: Publish to npm
    needs: "quality"
    if: >-
      github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
      id-token: write
    uses: dsh-plugins/dsh-npm-publish/.github/workflows/npm-publish.yml@main
    with:
      install-command: "npm install"
      prepare-command: |
        npm run build
        npm pack --dry-run
      publish-flags: "--access public"
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
