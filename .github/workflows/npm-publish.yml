# 自动发布到 npm：参考 dsh-auxiliary 与 dsh-thought-buddy 的 npm-publish.yml。
#
# 与参考仓库的差异：
#   - 本仓库不提交锁文件，因此用 `npm install` 代替 `npm ci`，也不使用
#     setup-node 的 npm 缓存（缓存依赖锁文件）。
#   - dsh-loader 没有 typecheck 脚本：质量门禁改用 `npm test`。
#     测试用例从 ../dist/*.js 导入编译产物，而 dist/ 是 gitignored 的，
#     因此 package.json 里的 `pretest` 会先执行 `build:host`（tsc）生成 dist。
#   - 客户端 bundle 由 tsdown 构建（`npm run build:client`），tsdown 已加入
#     devDependencies，干净环境安装后即可构建 lib/client.js。
#   - 发布时需先执行完整 `npm run build`（tsc 生成 dist + tsdown 生成 lib），
#     否则发布的 tarball 会缺少 package.json main 指向的 dist/index.js。
#   - 发布规则与参考一致：推送 main 发布 -dev.<run-id>（dist-tag=next），
#     打 vX.Y.Z 标签发布正式版（dist-tag=latest，要求标签名与版本号完全一致）。
name: CI and npm Publish

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  NPM_REGISTRY: 'https://registry.npmjs.org'

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ env.NPM_REGISTRY }}
      - name: Install dependencies
        run: npm install
      - name: Build client bundle
        run: npm run build:client
      - name: Run tests
        run: npm test
      - name: Inspect npm package contents
        run: npm pack --dry-run

  publish:
    name: Publish to npm
    needs: quality
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ env.NPM_REGISTRY }}
      - name: Install dependencies
        run: npm install
      - name: Resolve publish version
        id: release
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          BASE_VERSION="$(node -p "require('./package.json').version")"
          if [[ ! "$BASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::package.json version must be a stable X.Y.Z value; got $BASE_VERSION"
            exit 1
          fi

          if [[ "$REF_TYPE" == "branch" ]]; then
            PUBLISH_VERSION="${BASE_VERSION}-dev.${GITHUB_RUN_ID}"
            DIST_TAG="next"
            node - "$PUBLISH_VERSION" <<'NODE'
          const fs = require('node:fs');
          const version = process.argv[2];
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          packageJson.version = version;
          fs.writeFileSync('package.json', `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE
          elif [[ "$REF_TYPE" == "tag" ]]; then
            if [[ "$REF_NAME" != "v$BASE_VERSION" ]]; then
              echo "::error::tag $REF_NAME must exactly match v$BASE_VERSION"
              exit 1
            fi
            PUBLISH_VERSION="$BASE_VERSION"
            DIST_TAG="latest"
          else
            echo "::error::unsupported ref type: $REF_TYPE"
            exit 1
          fi

          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$PUBLISH_VERSION" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
      - name: Build (dist + client bundle)
        run: npm run build
      - name: Inspect npm package contents
        run: npm pack --dry-run
      - name: Check whether the version already exists
        id: published
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.release.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          if QUERY_OUTPUT="$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry="$NPM_REGISTRY" 2>&1)"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published."
          elif grep -q 'E404' <<< "$QUERY_OUTPUT"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$QUERY_OUTPUT" >&2
            exit 1
          fi
      - name: Publish package
        if: steps.published.outputs.exists != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
        run: npm publish --tag "$DIST_TAG" --access public